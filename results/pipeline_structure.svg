<svg width="680" height="536" viewBox="0 0 680 536" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline structure of the src folder</title>
<desc>Six sequential pipeline stages, each grouping several single-purpose files, alongside a shared foundation of four core modules used throughout.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="536" fill="#f9f9f7"/>

<g stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="230" y1="96" x2="230" y2="120"/>
<line x1="230" y1="176" x2="230" y2="200"/>
<line x1="230" y1="256" x2="230" y2="280"/>
<line x1="130" y1="336" x2="130" y2="360"/>
<line x1="330" y1="336" x2="330" y2="360"/>
<line x1="130" y1="416" x2="130" y2="440"/>
<line x1="330" y1="416" x2="330" y2="440"/>
</g>

<g>
<rect x="40" y="40" width="380" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="230" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Load and explore data</text>
<text x="230" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">load_data.py, eda.py — 2 files</text>
</g>

<g>
<rect x="40" y="120" width="380" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="230" y="143" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Generate synthetic text (LLM)</text>
<text x="230" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">6 files, one prompt strategy each</text>
</g>

<g>
<rect x="40" y="200" width="380" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="230" y="223" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Assemble training and test sets</text>
<text x="230" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">7 files, one dataset variant each</text>
</g>

<g>
<rect x="40" y="280" width="380" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="230" y="303" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Train models</text>
<text x="230" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">train.py — one shared entry point</text>
</g>

<g>
<rect x="40" y="360" width="180" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="130" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Extra experiments</text>
<text x="130" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">4 files</text>
</g>

<g>
<rect x="240" y="360" width="180" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="330" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Evaluation</text>
<text x="330" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">2 files</text>
</g>

<g>
<rect x="40" y="440" width="380" height="56" rx="4" fill="#eeedfe" stroke="#7f77dd" stroke-width="0.5"/>
<text x="230" y="463" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215c">Report and documentation</text>
<text x="230" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534ab7">results_report.html, README.md</text>
</g>

<g>
<rect x="440" y="180" width="200" height="180" rx="4" fill="#f1efe8" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text x="540" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2c2c2a">Shared foundation</text>
<text x="540" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">config.py</text>
<text x="540" y="253" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">preprocessing.py</text>
<text x="540" y="271" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">metrics.py</text>
<text x="540" y="289" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">gen_common.py</text>
<text x="540" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">used by every stage</text>
<text x="540" y="331" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">in the pipeline</text>
</g>
</svg>
